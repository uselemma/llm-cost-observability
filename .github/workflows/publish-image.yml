name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Repo-owned package (same pattern as uselemma/platform/{api,core}).
  # Do not publish under uselemma/platform/* from this repo — Packages API
  # cannot manage that path and the cluster pull PAT gets 403.
  IMAGE_NAME: ${{ github.repository }}/aig-observability

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Ensure org can pull package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="llm-cost-observability%2Faig-observability"
          # Prefer internal so org-entitled PATs can pull without making it public.
          gh api --method PATCH \
            "/orgs/uselemma/packages/container/${PKG}" \
            -f visibility=internal
          # Cluster pull secret uses jason136 (same as platform/api).
          gh api --method PUT \
            "/orgs/uselemma/packages/container/${PKG}/access/jason136" \
            -f permission=read
