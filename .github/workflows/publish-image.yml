name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/uselemma/platform/aig-observability:latest
            ghcr.io/uselemma/platform/aig-observability:${{ github.sha }}
      - name: Ensure org can pull package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Internal = any org member / entitled PATs with read:packages for org
          gh api --method PATCH \
            "/orgs/uselemma/packages/container/platform%2Faig-observability" \
            -f visibility=internal || true
          # Grant the GHCR pull user used by clusters (same as platform/api)
          gh api --method PUT \
            "/orgs/uselemma/packages/container/platform%2Faig-observability/access/jason136" \
            -f permission=read || true
